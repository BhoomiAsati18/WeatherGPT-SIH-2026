[project]
name = "weathergpt-backend"
version = "0.1.0"
description = "WeatherGPT Conversational AI for Weather Forecasting, Alerts, and Climate Information (SIH26068)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
